name: project-name

services:
  database:
    image: mariadb:12.0.2-ubi10
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_password}
      - MARIADB_USER=${MARIADB_USER:-app}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-app_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-app}
    volumes:
      - database_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.1
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=database
      - PMA_USER=${MARIADB_USER:-app}
      - PMA_PASSWORD=${MARIADB_PASSWORD:-app_password}
    depends_on:
      - database
    restart: unless-stopped

  php-fpm:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - .:/var/www/
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.custom.ini
    depends_on:
      - database
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - $PWD/docker/caddy/conf:/etc/caddy
      - $PWD:/var/www
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php-fpm

volumes:
  database_data:
  caddy_data:
  caddy_config:
