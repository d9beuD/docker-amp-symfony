services:
  database:
    image: mariadb:12.3
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_password}
      - MARIADB_USER=${MARIADB_USER:-app}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-app_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-app}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - 127.0.0.1:3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - 127.0.0.1:8080:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=database
      - PMA_USER=${MARIADB_USER:-app}
      - PMA_PASSWORD=${MARIADB_PASSWORD:-app_password}
    depends_on:
      - database
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    environment: &app-env
      # Overrides the PostgreSQL URL that Symfony's Doctrine recipe writes to .env
      - DATABASE_URL=mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:-app_password}@database:3306/${MARIADB_DATABASE:-app}?serverVersion=12.3.2-MariaDB&charset=utf8mb4
    ports:
      - 127.0.0.1:8000:3000
    volumes:
      - .:/app/
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      database:
        condition: service_healthy

  # Prod image, only started by `make smoke-prod` (profile "prod")
  app-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: prod
    environment: *app-env
    # Same as a hardened host: smoke-prod fails if the image needs root or a capability
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - 127.0.0.1:8001:3000
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
  caddy_data:
  caddy_config:
